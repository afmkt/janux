# Single-host example seed (Caddy front on `localhost`).
# Tenant `localhost` serves the whole janux surface; the protected static
# app lives at `path /app` and is gated here by the three /app rows near the
# end (forward_auth -> /api/v1/auth/verify -> default-deny engine).
# Copy -> seed.toml, set your [seed.resend] credentials, fill the admin
# `email`, then `up.py single-host`. See ../README.md.

# ================================================================
# Seed configuration: populates tenant DB records on startup.
# Load order: `janux -c base -c seed` (the default).
#
# Each [[seed]] entry creates (or updates) one tenant: its domains,
# built-in roles, bootstrap users, RBAC policies, and provider
# config. Seeding is idempotent — roles/users/policies are upserted,
# so the server can reboot against the same file.
#
# Built-in role model:
#   root    - cross-tenant platform operator: tenant lifecycle only.
#            SEED-ONLY: root is created exclusively by this file.
#            Runtime tenants (admin/tenant/create) do NOT get root.
#            At most ONE tenant may hold a root user (enforced at boot).
#   admin - per-tenant operator: everything inside its own tenant.
#   scim    - machine provisioning: user lifecycle via /scim/v2/*
#            (level 60 - above user, below admin: cannot administer
#            administrators or root).
#   user    - regular account: self-service endpoints.
#   guest   - authenticated, no admin grants (default-deny placeholder
#           for app-level policies added later via admin/policy/*).
#
# Roles live in the per-tenant DB. "Cross-tenant" works because the
# tenant/* handlers act globally once the policy gate passes, and the
# gate is evaluated in the caller's home tenant - the one seeding
# `root` below. Tenants created later at runtime get their own
# roles/policies via admin/tenant/create - bootstrap_tenant, which
# provisions the admin/scim/user/guest catalog but
# NOT root. The first admin's email or mobile is created UNVERIFIED
# - the admin proves ownership at first login via the normal
# ceremony. Runtime tenants accept either admin_email (magic link)
# or admin_mobile (SMS OTP), mutually exclusive.
#
# Policy notes (TWO TIER):
# - Built-in admin/scim/tenant/user endpoints are the CODE TIER: guarded
#   in code by role membership (protect_* hoops in router.rs / scim.rs),
#   so they need NO policy rows here.
# - Only tenant-defined resources use the policy ENGINE (default-deny,
#   validate_jwt_for at /api/v1/verify), e.g. the /app forward-auth rows
#   below. Paths match exactly (no wildcards, G-43); `action` omitted =
#   all HTTP methods; mfa = true would require TOTP step-up.
#
# SECURITY: development bootstrap only. A seeded user WITHOUT `email`
# has no credential and can never sign in — strict signup refuses the
# pre-existing username (the old attach-on-first-verify takeover hole is
# closed). Give bootstrap accounts their credential via the `email`
# field below (seeded VERIFIED on every boot — idempotent, and the
# repair path for an already-booted credential-less admin is "add the
# email, restart"), or later via `admin/user/attach_email`. Replace the
# placeholder addresses before running on a publicly reachable host.
# ================================================================

[[seed]]
name = "localhost"
# Domain fields:
#   id        — hostname clients reach this tenant at (Host / X-Forwarded-Host).
#   cors      — [] forbid, ["tenant"] share among the tenant's domains,
#               or an explicit allow list.
#   pages_dir — optional filesystem root of per-domain frontend page
#               overrides. Scaffold it with `janux dump-frontend <dir>`,
#               prune/edit, then point the domain at it. Serving is
#               per-file: anything missing from the dir falls back to the
#               embedded frontend. Config-file-only by design — see
#               docs/FRONTEND.md.
domains = [{ id = "localhost", cors = [] }, { id = "0.0.0.0", cors = [] }]
# Example with a page override:
# domains = [
#     { id = "localhost", cors = [] },
#     { id = "auth.example.com", cors = ["tenant"], pages_dir = "./data/pages/auth.example.com" },
# ]

# Pre-built roles. Created before users and policies so that
# policy_create can resolve them.
roles = ["root", "admin", "scim", "user", "guest"]

# Bootstrap accounts. `email` (optional) vouches that address as a
# VERIFIED login credential at seed time (G-131) — set the admin's to an
# inbox you control; that is what makes the magic-link quickstart sign-in
# work. An account without it has no credential and cannot sign in until
# one is attached.
users = [
      { name = "root", roles = ["root"], active = true, email = "root@example.com" },
      { name = "admin", roles = ["admin"], active = true, email = "admin@example.com" },
]

policies = [
     { domain = "localhost", resource = "/app", role = "user" },
     { domain = "localhost", resource = "/app", role = "admin" },
     { domain = "localhost", resource = "/app", role = "root" },
     # Every other field defaults: action = all methods; source/target =
     #  Nothing; mfa = false, allowed = true. To scope /app to the caller,
     #  opt in to a resolver, e.g. grant a user their own tenant:
     # { domain = "localhost", resource = "/app", role = "user",
     #  source = "User", target = { FromHeader = { hname = "x-tenant-id" } },
     #  mfa = true }
]

[seed.resend]
from = "noreply@example.com"
resend_key = "your-resend-api-key"
template = "./email/verify.html"
# Where the magic link lands: the hosted login SPA, which reads
# token/username/email from the query and auto-verifies (G-133 — the old
# /api/v1/auth/email/landing value pointed at a route that never
# existed, so every emailed link 404'd).
verify_url = "http://localhost/login"


[seed.alisms]
api_secret = "your-sms-api-secret"
api_key = "your-sms-api-key"
template_code = "your-template-code"
sign_name = "Your Company"
region_id = "cn-shanghai"
endpoint = "dysmsapi.aliyuncs.com"
