# nginx "simple service": serves a static file at the /app/ path.
#
# Caddy forward-auth gates /app against janux WITHOUT stripping the prefix, so
# nginx receives the FULL /app path. We map /app/ onto the static root with an
# alias; index.html is mounted from ./site (see compose.yml). A bare /app (no
# trailing slash) is redirected to /app/ so the page loads.
server {
    listen 80;

           location /app/ {
             alias /usr/share/nginx/html/;
          }

            # Caddy forwards /app (no slash) here; send it to /app/ so the
            # alias resolves a file.
          location = /app {
            return 301 /app/;
          }
}
