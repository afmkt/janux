# ---------------------------------------------------------------------------
# Janux example — janux + Caddy + a protected static "app", one host.
# ---------------------------------------------------------------------------
# One hostname (localhost:80/443). Caddy fronts everything by *path*:
#
#        /app -> forward-auth via janux (/api/v1/auth/verify) -> nginx
#        /     -> janux    (discovery, OIDC, admin UI, SCIM, health, /login)
#
# Why a single host: janux's session cookie is host-only (no Domain attribute)
# + Secure, so the browser only re-sends it to the SAME host that set it --
# which is the one Caddy forwards both /login and /app to.
#
# Network: a fixed bridge subnet (172.28.0.0/16) lets trusted_proxies pin
# Caddy's source IP so janux honors X-Forwarded-* without a "proxy IP not
# trusted" boot warning (G-149).
#
# TLS: the Secure cookie needs https, and Caddy auto-redirects localhost
# http->https. TLS is a per-site `tls internal` directive in the Caddyfile
# (caddy's local CA). NOTE: this caddy build ignores the CADDY_TLS env var and
# rejects a `global { tls internal }` block, so that env plumbing is not used.
# On Linux open https://127.0.0.1/app; on macOS trust Caddy's CA once
# (see README.md §"First time on macOS").

name: janux

services:
  # janux: the auth server + forward-auth probe (built here or pulled).
  auth:
    image: ghcr.io/afmkt/janux:latest
    pull_policy: always
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: auth
    restart: unless-stopped
    networks:
      - default
    # janux reads its config from JANUX_CONFIG_FILE, a path inside the mounted
    # config/ DIRECTORY (not a single-file bind mount: a missing file no longer
    # turns into an empty dir that hides a real config or breaks the mount on a
    # dir<->file type change). Copy the committed template into config/ first,
    # then adjust the secrets:
    #   cp janux.example.toml config/janux.toml
    environment:
      JANUX_CONFIG_FILE: /app/config/janux.toml
    volumes:
      # The config dir janux reads JANUX_CONFIG_FILE from; data_dir is ./data.
      - ./config:/app/config:ro
      # Per-domain UI override: serve the freshly built frontend from the host's
      # dist/ instead of the embedded (image-baked) UI, so the running stack
      # shows a new build with NO image rebuild. Remove this line and the
      # `pages_dir` in config/janux.toml to revert to the embedded UI.
      - ../frontend/dist:/app/pages-override:ro
      - janux_auth_data:/app/data
    healthcheck:
      # 503 unless server state is injected and the data dir is present
      # (src/ops.rs) -> a broken volume reads unhealthy, not "serving".
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 2G

  # The "simple service": a static file gated by forward-auth. nginx:alpine
  # stands in for "your app" and serves ./site over plain HTTP INSIDE the
  # network (no published port); app-nginx.conf maps /app/ onto the static
  # root so Caddy can forward-auth the request WITHOUT stripping the path.
  app:
    image: nginx:alpine
    container_name: app
    restart: unless-stopped
    depends_on:
      - auth
    networks:
      - default
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./app-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"

  # Caddy: the public front-end / forward-auth gate.
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - default
    # TLS is `internal` via the per-site `tls internal` directive in the
    # Caddyfile (this caddy build ignores the CADDY_TLS env var and rejects a
    # `global { tls internal }` block, so no env override is needed here).
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - janux_caddy_config:/config/caddy
      - janux_caddy_data:/data
    depends_on:
      auth:
        condition: service_healthy

  # Mailpit: a local SMTP sink + web inbox so the magic-link email stays
  # self-contained (no SaaS). `auth` hands magic links to mailpit:1025 (plain
  # SMTP, no TLS); the human reads the "Janux login" link in the web inbox at
  # http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP the auth container sends magic links to
      - "8025:8025"   # web inbox UI the user reads the link from
    networks:
      - default

# 172.28.0.0/16 so config/janux.toml's trusted_proxies pin Caddy's bridge source (also
# avoids the G-149 boot warning).
networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# Named volumes are per-project (name: janux) so they don't collide with other
# docker compose projects on the same host.
volumes:
  janux_auth_data:
  janux_caddy_data:
  janux_caddy_config:
