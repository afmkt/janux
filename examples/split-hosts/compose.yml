# ── Split-hosts example ────────────────────────────────────────────────
#   caddy  TWO public hostnames, ONE janux instance:
#             - app.example.com    -> protected /app (forward_auth) + full UI
#             - auth.example.com   -> the canonical IdP/admin/discovery host
#   auth   janux reverse proxy target & forward-auth server (built or pulled)
#   app    the "simple service": a static site behind /app (existing image)
#
# TLS is mandatory (the Secure cookie on a non-loopback host). TLS is
# configured in the Caddyfile via a per-site `tls internal` directive, so each
# hostname is signed by caddy's local CA. up.py maps the two hostnames to
# 127.0.0.1 and trusts that CA on macOS:
#
#   python3 up.py split-hosts up          # https://app.example.com/app
#   python3 up.py split-hosts trust-ca    # macOS: trust the local CA
#   python3 up.py split-hosts down        # keep volumes (CA stays trusted)
#
# NOTE: this setup publishes 80/443, the same as single-host — don't run both
# at once. Pick one.

services:
  # janux: the auth server + forward-auth probe
  auth:
    image: ghcr.io/afmkt/janux:latest
    pull_policy: always
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: auth
    restart: unless-stopped
    networks:
      - default
    volumes:
      - ./base.toml:/app/base.toml:ro
      - ./seed.toml:/app/seed.toml:ro
      - split_auth_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 2G

  # caddy: the public gateway for BOTH hostnames
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # TLS is `internal` via the per-site `tls internal` directive in the
    # Caddyfile. This caddy build ignores the CADDY_TLS env var and rejects a
    # `global { tls internal }` block, so no env override is set here; the
    # Secure cookie is served over caddy's local CA.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - split_caddy_data:/data
      - split_caddy_config:/config
    depends_on:
      auth:
        condition: service_healthy

    # app: the "simple service" — static files behind /app
  app:
    image: nginx:alpine
    container_name: app
    restart: unless-stopped
    networks:
      - default
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./app-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"

# 172.29.0.0/16 so base.toml's trusted_proxies=["172.29.0.0/16"] pins the
# caddy source that supplies X-Forwarded-* (also avoids a G-149 boot warning).
networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16

# Distinct from single-host so the two setups' data can coexist on disk.
volumes:
  split_auth_data:
  split_caddy_data:
  split_caddy_config:
