# ── Split-hosts example ──────────────────────────────────────────────────
#   caddy  TWO public hostnames, ONE janux instance:
#            - app.example.com    -> protected /app (forward_auth) + full UI
#            - auth.example.com   -> the canonical IdP/admin/discovery host
#   auth   janux reverse proxy target & forward-auth server (built or pulled)
#   app    the "simple service": a static site behind /app (existing image)
#
# up.py generates base.toml/seed.toml and — because TLS is required for the
# Secure cookie on a non-loopback host — mints a local CA, trusts it, and maps
# the hostnames to 127.0.0.1:
#
#   python3 up.py split-hosts up --tls          # https://app.example.com/app
#   python3 up.py split-hosts down
#
# NOTE: this setup publishes 80/443, the same as single-host — don't run both
# at once. Pick one.

services:
  # janux: the auth server + forward-auth probe
  auth:
    image: ${JANUX_IMAGE:-janux:latest}
    pull_policy: ${JANUX_PULL:-build}
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: janux-split-hosts
    restart: unless-stopped
    networks:
      - default
    volumes:
      - ./base.toml:/app/base.toml:ro
      - ./seed.toml:/app/seed.toml:ro
      - split_auth_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 2G

  # caddy: the public gateway for BOTH hostnames
  caddy:
    image: caddy:latest
    container_name: caddy-split-hosts
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # up.py sets CADDY_TLS="internal" (caddy's local CA); the Secure
      # cookie needs TLS. No tls directive in the Caddyfile, so this env is the
      # one TLS control.
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - split_caddy_data:/data
      - split_caddy_config:/config
    depends_on:
      auth:
        condition: service_healthy

   # app: the "simple service" — static files behind /app
  app:
    image: nginx:alpine
    container_name: app-split-hosts
    restart: unless-stopped
    networks:
      - default
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./app-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"

# 172.29.0.0/16 so base.toml's trusted_proxies=["172.29.0.0/16"] pins the
# caddy source that supplies X-Forwarded-* (also avoids a G-149 boot warning).
networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
         - subnet: 172.29.0.0/16

# Distinct from single-host so the two setups' data can coexist on disk.
volumes:
  split_auth_data:
  split_caddy_data:
  split_caddy_config:
