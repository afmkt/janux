
[[seed]]
name = "example"
# Domain fields:
#   id        — hostname clients reach this tenant at (Host / X-Forwarded-Host).
#   cors      — [] forbid, ["tenant"] share among the tenant's domains,
#               or an explicit allow list.
#   pages_dir — optional filesystem root of per-domain frontend page
#               overrides. Scaffold it with `janux dump-frontend <dir>`,
#               prune/edit, then point the domain at it. Serving is
#               per-file: anything missing from the dir falls back to the
#               embedded frontend. Config-file-only by design — see
#               docs/FRONTEND.md.
# Sub-domain SSO (#1) + tenant-scoped redirect (#5): each domain may set
#   cookie_scope  = registrable domain the session cookie is scoped to
#                   (`Domain=...`), sharing ONE login across the sibling
#                   domains janux serves under it. Must label-cover every
#                   host it is used on (RFC 6265 5.1.3, label-aligned, not
#                   a substring match). Unset = host-only cookie.
#   redirect_url = absolute origin the UNAUTHENTICATED forward-auth 303
#                   points at; janux appends /login. Unset = relative /login.
domains = [
    { id = "app.example.com", cors = [
    ], cookie_scope = "example.com", redirect_url = "https://auth.example.com" },
    { id = "auth.example.com", cors = [
    ], cookie_scope = "example.com" },
    { id = "0.0.0.0", cors = [
    ] },
]
# Example with a page override:
# domains = [
#     { id = "localhost", cors = [] },
#     { id = "auth.example.com", cors = ["tenant"], pages_dir = "./data/pages/auth.example.com" },
# ]

# Pre-built roles. Created before users and policies so that
# policy_create can resolve them.
roles = ["root", "admin", "scim", "user", "guest"]

# Bootstrap accounts. `email` (optional) vouches that address as a
# VERIFIED login credential at seed time (G-131) — set the admin's to an
# inbox you control; that is what makes the magic-link quickstart sign-in
# work. An account without it has no credential and cannot sign in until
# one is attached.
users = [
    { name = "root", roles = [
        "root",
    ], active = true, email = "root@example.com" },
    { name = "admin", roles = [
        "admin",
    ], active = true, email = "public.shen7310@gmail.com" },
]

policies = [
    # ── root: cross-tenant lifecycle ──────────────────────────────────
    { domain = "app.example.com", resource = "/api/v1/admin/tenant/list", role = "root", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/tenant/create", role = "root", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/tenant/delete", role = "root", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── admin: domains ────────────────────────────────────────────────
    { domain = "app.example.com", resource = "/api/v1/admin/domain/list", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/domain/create", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/domain/delete", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── admin: users ──────────────────────────────────────────────────
    { domain = "app.example.com", resource = "/api/v1/admin/user/list", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/create", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/activate", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/delete", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/add_role", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/remove_role", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/remove_email", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/attach_email", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/remove_mobile", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/remove_passkey", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/remove_social", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/roles", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── admin: roles ──────────────────────────────────────────────────
    { domain = "app.example.com", resource = "/api/v1/admin/role/list", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/role/create", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/role/delete", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── admin: social providers ───────────────────────────────────────
    { domain = "app.example.com", resource = "/api/v1/admin/provider/list", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/provider/create", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/provider/delete", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── admin: policies ───────────────────────────────────────────────
    { domain = "app.example.com", resource = "/api/v1/admin/policy/list", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/policy/create", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/policy/delete", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── admin: signing keys ───────────────────────────────────────────
    { domain = "app.example.com", resource = "/api/v1/admin/key/list", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/key/create", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/key/delete", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/key/retire", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── admin: TOTP administration ────────────────────────────────────
    { domain = "app.example.com", resource = "/api/v1/admin/totp/list", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/totp/remove", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── admin: OIDC relying parties ───────────────────────────────────
    { domain = "app.example.com", resource = "/api/v1/admin/oauth2client/list", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/oauth2client/create", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/oauth2client/delete", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/oauth2client/meta", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── admin: OIDC feature switches (Dynamic Client Registration) ────
    { domain = "app.example.com", resource = "/api/v1/admin/oidc/config", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── admin: observability (process-global telemetry) ───────────────
    { domain = "app.example.com", resource = "/api/v1/admin/metrics", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── user: self-service (handlers act on the caller's own account) ─
    { domain = "app.example.com", resource = "/api/v1/admin/user/activate/self", role = "user", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/api/v1/admin/user/delete/self", role = "user", source = "Nothing", target = "Nothing", mfa = false, allowed = true },

    # ── scim: machine provisioning (G-S1/G-S2). `{id}` is the canonical
    #    resource the SCIM protect hoop substitutes for the dynamic path
    #    segment — policies match exactly (G-43), so one row covers all
    #    resource instances. The role + policy rows are the default
    #    provisioning; the machine principal itself is NOT seeded (a
    #    committed client secret would be a standing provisioning
    #    credential). Register one per IdP connection as admin — that
    #    registration is the consent the client_credentials grant
    #    enforces (requested ∩ registered scope):
    #      POST /api/v1/admin/oauth2client/create
    #        { client_id: "okta-scim", secret: "<random>",
    #          grant_types: "client_credentials",
    #          token_endpoint_auth_method: "client_secret_post",
    #          default_scopes: "scim" }
    # ─
    { domain = "app.example.com", resource = "/scim/v2/Users", role = "scim", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/scim/v2/Users/{id}", role = "scim", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    # ── the forward_auth-gated app resource (domain = app.example.com) ────
    # Exact match (G-43): the browser request path is /app.
    { domain = "app.example.com", resource = "/app", role = "user", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/app", role = "admin", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
    { domain = "app.example.com", resource = "/app", role = "root", source = "Nothing", target = "Nothing", mfa = false, allowed = true },
]

[seed.resend]
from = "noreply@example.com"
resend_key = "your-resend-api-key"
template = "./email/verify.html"
# Where the magic link lands: the hosted login SPA, which reads
# token/username/email from the query and auto-verifies (G-133 — the old
# /api/v1/auth/email/landing value pointed at a route that never
# existed, so every emailed link 404'd).
verify_url = "https://app.example.com/login"


[seed.alisms]
api_secret = "your-sms-api-secret"
api_key = "your-sms-api-key"
template_code = "your-template-code"
sign_name = "Your Company"
region_id = "cn-shanghai"
endpoint = "dysmsapi.aliyuncs.com"
