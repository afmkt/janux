# Janux example config — the single default config file for janux running
# BEHIND Caddy. `janux.toml` is the default name janux loads from its working
# dir; copy this to `janux.toml` (gitignored, per-run secrets) and adjust, then:
#   cp janux.example.toml janux.toml
#   docker compose up -d            # from this directory
#
# This host runs the whole janux surface (hosted login UI, OIDC, admin,
# SCIM, health) AND the forward-auth probe for the protected static app,
# because a single Caddy front (`localhost`) is the only layout janux's
# host-only session cookie supports cleanly. See README.md.
#
# Two parts in one file:
#   1. Platform config (data_dir, encryption_key, proxy trust, [bind]).
#   2. The [[seed]] section — first-boot bootstrap of tenant state
#      (domains, roles, users, policies, provider config).
#
# `--config <file>` layers additional files on top (later files win);
# `JANUX__*` env vars override every value. An empty or absent [[seed]]
# section is allowed — the server just seeds nothing on boot.

# ── Platform config ───────────────────────────────────────────────────────────
# 64 hex chars (32 bytes) for AES-256-GCM. Generate your own, e.g.:
#   openssl rand -hex 32
# RECOVERY-CRITICAL: encrypts at-rest secrets (signing-key privates,
# social provider secrets, TOTP, mail delivery keys).
data_dir = "./data"

encryption_key = "1234567812345678123456781234567812345678123456781234567812345678"

# TRUE: Caddy overwrites X-Forwarded-*, so janux trusts them for tenant
# resolution (Host / X-Forwarded-Host) and the forward-auth verify path
# (X-Forwarded-Uri / X-Forwarded-Method). With this off, /app can never be
# gated — verify would evaluate its own endpoint, not the proxied path.
trust_forwarded_headers = true

# G-149: restrict WHICH peers may SUPPLY X-Forwarded-*. Caddy sits on the
# fixed `janux` bridge subnet (172.28.0.0/16 in compose.yml), so this
# allow-list closes the tenant-spoof / limiter-bypass hole without a boot
# warning.
trusted_proxies = ["172.28.0.0/16"]

# Opt-in: when Caddy's forward_auth probe is UNAUTHENTICATED, janux answers 303
# -> /login instead of a bare 401, so a browser is sent to the hosted login page
# and can authenticate + retry. A proxy cannot inject a Location into a copied
# 3xx, so the redirect is janux's job. Off by default (401 problem+json is still
# a valid forward-auth "denied" answer); harmless for direct callers.
forward_auth_redirect = true

# Verbose error diagnostics. When ON, 401/403 failure responses carry the full
# reason in `detail` (which token check failed, which role is missing) — a big
# help while developing, but it lets a client learn how to defeat a gate, so
# NEVER leave it on a reachable host. Follows RUN_ENV when unset (ON for
# development, the default; OFF for production); set explicitly to override:
# debug = false

[bind]
address = "0.0.0.0"
port = 8080

# ── Seed configuration ────────────────────────────────────────────────────────
# Populates tenant DB records on startup. Idempotent — roles/users/policies are
# upserted, so the server can reboot against the same file.
#
# Each [[seed]] entry creates (or updates) one tenant: its domains,
# built-in roles, bootstrap users, RBAC policies, and provider
# config.
#
# Built-in role model:
#   root    - cross-tenant platform operator: tenant lifecycle only.
#            SEED-ONLY: root is created exclusively by this file.
#            Runtime tenants (admin/tenant/create) do NOT get root.
#            At most ONE tenant may hold a root user (enforced at boot).
#   admin - per-tenant operator: everything inside its own tenant.
#   scim    - machine provisioning: user lifecycle via /scim/v2/*
#            (level 60 - above user, below admin: cannot administer
#            administrators or root).
#   user    - regular account: self-service endpoints.
#   guest   - authenticated, no admin grants (default-deny placeholder
#           for app-level policies added later via admin/policy/*).
#
# Roles live in the per-tenant DB. "Cross-tenant" works because the
# tenant/* handlers act globally once the policy gate passes, and the
# gate is evaluated in the caller's home tenant - the one seeding
# `root` below. Tenants created later at runtime get their own
# roles/policies via admin/tenant/create - bootstrap_tenant, which
# provisions the admin/scim/user/guest catalog but
# NOT root. The first admin's email or mobile is created UNVERIFIED
# - the admin proves ownership at first login via the normal
# ceremony. Runtime tenants accept either admin_email (magic link)
# or admin_mobile (SMS OTP), mutually exclusive.
#
# Policy notes (TWO TIER):
# - Built-in admin/scim/tenant/user endpoints are the CODE TIER: guarded
#   in code by role membership (protect_* hoops in router.rs / scim.rs),
#   so they need NO policy rows here.
# - Only tenant-defined resources use the policy ENGINE (default-deny,
#   validate_jwt_for at /api/v1/verify), e.g. the /app forward-auth rows
#   below. Paths match exactly (no wildcards, G-43); `action` omitted =
#   all HTTP methods; mfa = true would require TOTP step-up.
#
# SECURITY: development bootstrap only. A seeded user WITHOUT `email`
# has no credential and can never sign in — strict signup refuses the
# pre-existing username (the old attach-on-first-verify takeover hole is
# closed). Give bootstrap accounts their credential via the `email`
# field below (seeded VERIFIED on every boot — idempotent, and the
# repair path for an already-booted credential-less admin is "add the
# email, restart"), or later via `admin/user/attach_email`. Replace the
# placeholder addresses before running on a publicly reachable host.

[[seed]]
name = "localhost"
# Domain fields:
#   id        — hostname clients reach this tenant at (Host / X-Forwarded-Host).
#   cors      — [] forbid, ["tenant"] share among the tenant's domains,
#               or an explicit allow list.
#   pages_dir — optional filesystem root of per-domain frontend page
#               overrides. Scaffold it with `janux dump-frontend <dir>`,
#               prune/edit, then point the domain at it. Serving is
#               per-file: anything missing from the dir falls back to the
#               embedded frontend. Config-file-only by design — see
#               docs/FRONTEND.md.
#
# In this example the `localhost` domain's UI is served from a bind-mounted
# copy of the built frontend (`../frontend/dist` -> `/app/pages-override` in
# compose.yml), so a fresh `npm run build` in ../frontend shows up in the
# running stack with NO image rebuild and NO restart (janux reads the dir
# per request). The `0.0.0.0` domain keeps the embedded UI. Remove the
# `pages_dir` (and the matching volume in compose.yml) to revert.
domains = [{ id = "localhost", pages_dir = "/app/pages-override", cors = [] }, { id = "0.0.0.0", cors = [] }]

# Pre-built roles. Created before users and policies so that
# policy_create can resolve them.
roles = ["root", "admin", "scim", "user", "guest"]

# Bootstrap accounts. `email` (optional) vouches that address as a
# VERIFIED login credential at seed time (G-131) — set the admin's to an
# inbox you control; that is what makes the magic-link quickstart sign-in
# work. An account without it has no credential and cannot sign in until
# one is attached. `tester` is a plain `user` to walk the protected /app
# flow as a regular account.
users = [
      { name = "root", roles = ["root"], active = true, email = "root@example.com" },
      { name = "admin", roles = ["admin"], active = true, email = "admin@example.com" },
      { name = "tester", roles = ["user"], active = true, email = "tester@example.com" },
]

# RBAC is default-deny: gate /app here with exact-match rows. The three
# progressively richer shapes and the source/target self-scoping engine are
# documented in README.md#writing-policies-rbac-authoring.
policies = [
        # Scenario 2 (the workhorse): grant the exact forward-auth path /app to
        # each built-in role. All other fields default (action = all methods,
        # source/target = Nothing, mfa = false, allowed = true). Scenario 1
        # (domain+role) and Scenario 3 (source+target self-scoping, e.g. a user
        # reaching only their own /app/{owner}) are documented in
        # README.md#writing-policies-rbac-authoring.
        { domain = "localhost", resource = "/app", role = "user" },
        { domain = "localhost", resource = "/app", role = "admin" },
        { domain = "localhost", resource = "/app", role = "root" },
]

# ── Mail backend: self-contained SMTP via the local Mailpit relay ─────────────
# This example ships with Mailpit (a container in compose.yml: SMTP :1025, web
# inbox :8025), so the magic link is fully local — no SaaS, no real mailbox.
# `auth` hands links to mailpit:1025 (plain SMTP); read the "Janux login" link
# in the web inbox at http://localhost:8025.
#
# mail_backend selects the active delivery backend regardless of the priority
# order (resend -> zonemail -> smtp) below.
mail_backend = "smtp"

[seed.smtp]
host = "mailpit"              # the Mailpit container, on the compose network
port = 1025                  # Mailpit SMTP (plain, no TLS)
from = "noreply@example.com"
# A non-existent on-disk path -> janux falls back to its embedded verify.html.
template = "verify.html"
# Where the magic link lands: the hosted login SPA auto-verifies on load.
verify_url = "https://localhost/login"
tls = "plain"

# ── Alternative mail backends (commented; enable one to replace Mailpit) ───────
# The email factor uses the FIRST configured backend in priority order
# resend -> zonemail -> smtp, or whichever `mail_backend` names above.
#
# Resend (hosted SaaS default when no mail_backend is set):
# [seed.resend]
# from = "noreply@example.com"
# resend_key = "your-resend-api-key"
# template = "./email/verify.html"
# verify_url = "http://localhost/login"
#
# Zonemail — a self-hosted DNS+SMTP stack (github.com/afmkt/zonemail):
# [seed.zonemail]
# base_url = "http://localhost:8787"   # the Zonemail HTTP API
# from = "noreply@example.com"
# template = "./email/verify.html"
# verify_url = "http://localhost/login"
# api_token = "..."                     # only when Zonemail's API auth is on
#
# Your own SMTP relay:
# [seed.smtp]
# host = "smtp.example.com"
# port = 587                           # STARTTLS submission port
# from = "noreply@example.com"
# template = "./email/verify.html"
# verify_url = "http://localhost/login"
# user = "you@example.com"             # optional relay auth
# password = "app-password"
# tls = "required"                     # plain|opportunistic|required|implicit
# insecure = false                    # dev only: accept unverified certs

# Present so the seed parses (OTPDTO has no default); never used because
# mail_backend = "smtp". Placeholders only.
[seed.alisms]
api_key = "unused"
api_secret = "unused"
template_code = "unused"
sign_name = "Example"
region_id = "cn-shanghai"
endpoint = "dysmsapi.aliyuncs.com"
