# Native binary release pipeline.
#
# GitHub Release assets:
#   - Linux amd64, Linux arm64
#   - Windows amd64, Windows arm64
#   (macOS is built locally on a Mac — macOS runners require paid
#   Actions minutes; attach the binary to the release manually:
#     cd frontend && npm ci && npm run build && cd ..
#     cargo build --release   # → target/release/janux
#     gh release upload v1.0.0 target/release/janux#janux-macos-arm64)
#
# Docker images are published independently by release-docker.yml.
#
# Triggered by version tags (v1.2.3); workflow_dispatch builds without
# creating a GitHub Release (artifacts stay on the run).

name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  # ═══════════════ Native binaries ═══════════════

  binaries:
    name: Binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 / arm64.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: janux
            asset: janux-linux-amd64
            packages: pkg-config libssl-dev
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary: janux
            asset: janux-linux-arm64
            packages: pkg-config libssl-dev
          # Windows amd64 (native) and arm64 (cross-compiled on amd64 host).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: janux.exe
            asset: janux-windows-amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: janux.exe
            asset: janux-windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/dist is embedded at compile time (rust-embed).
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.asset }}.tar.gz \
            -C target/${{ matrix.target }}/release ${{ matrix.binary }}

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/${{ matrix.binary }} `
            -DestinationPath dist/${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  # ═══════════════ GitHub Release (tag pushes only) ═══════════════

  release:
    name: Publish GitHub Release
    needs: [binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: janux-*
          path: assets
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            ## Docker images (linux/amd64 + linux/arm64)
            Published by the "Release Docker" workflow:
            - `docker pull ghcr.io/afmkt/janux:${{ github.ref_name }}`
            - Aliyun ACR (mainland China): `crpi-zuhwpd6fwca3b0fc.cn-shanghai.personal.cr.aliyuncs.com/afmkt/janux:${{ github.ref_name }}`
            (also tagged `latest` and short-SHA)

            ## Binaries
            Attached assets for Linux amd64/arm64,
            Windows amd64/arm64. macOS arm64: build locally
            (see workflow header) and attach to this release.
