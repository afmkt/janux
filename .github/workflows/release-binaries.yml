# Native binary release pipeline.
#
# GitHub Release assets:
#   - Linux amd64, Linux arm64
#   - Windows amd64, Windows arm64
#   (macOS is built locally on a Mac — macOS runners require paid
#   Actions minutes; attach the binary to the release manually:
#     cd frontend && npm ci && npm run build && cd ..
#     cargo build --release   # → target/release/janux
#     gh release upload v1.0.0 target/release/janux#janux-macos-arm64)
#
# Docker images are published independently by release-docker.yml.
#
# Triggered by version tags (v1.2.3); workflow_dispatch builds without
# creating a GitHub Release (artifacts stay on the run).

name: Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  # ═══════════════ Verification gate (G-135) ═══════════════
  #
  # A tag push used to publish four platforms' binaries with ZERO tests
  # run on the tagged commit. The release now waits for the same suite
  # CI runs (lib + unit, single-threaded) on the tag's checkout.

  verify:
    name: Verify (tests on the tagged commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run test suite (single-threaded, matches CI)
        run: cargo test --lib --test unit_tests --no-fail-fast -- --test-threads=1

  # ═══════════════ Native binaries ═══════════════

  binaries:
    name: Binary (${{ matrix.target }})
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 / arm64.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: janux
            asset: janux-linux-amd64
            packages: pkg-config libssl-dev
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary: janux
            asset: janux-linux-arm64
            packages: pkg-config libssl-dev
          # Windows amd64 (native) and arm64 (cross-compiled on amd64 host).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: janux.exe
            asset: janux-windows-amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: janux.exe
            asset: janux-windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/dist is embedded at compile time (rust-embed).
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # G-135: smoke-check the artifact we are about to publish. Windows
      # arm64 is cross-compiled on an amd64 host and cannot execute
      # there — it is the one asset published without a run check
      # (documented, not silent).
      - name: Smoke check (unix)
        if: runner.os != 'Windows' && matrix.target != 'aarch64-pc-windows-msvc'
        run: ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version

      - name: Smoke check (windows amd64)
        if: runner.os == 'Windows' && matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.asset }}.tar.gz \
            -C target/${{ matrix.target }}/release ${{ matrix.binary }}
          # G-135: publish a checksum next to every artifact so downloads
          # are verifiable.
          (cd dist && sha256sum ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256)

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/${{ matrix.binary }} `
            -DestinationPath dist/${{ matrix.asset }}.zip
          $hash = (Get-FileHash dist/${{ matrix.asset }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Set-Content -NoNewline dist/${{ matrix.asset }}.zip.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  # ═══════════════ GitHub Release (tag pushes only) ═══════════════

  release:
    name: Publish GitHub Release
    needs: [binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: janux-*
          path: assets
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            ## Docker images (linux/amd64 + linux/arm64)
            Published by the "Release Docker" workflow:
            - `docker pull ghcr.io/afmkt/janux:${{ github.ref_name }}`
            - Aliyun ACR (mainland China): `crpi-zuhwpd6fwca3b0fc.cn-shanghai.personal.cr.aliyuncs.com/afmkt/janux:${{ github.ref_name }}`
            (also tagged `latest` and short-SHA)

            ## Binaries
            Attached assets for Linux amd64/arm64,
            Windows amd64/arm64, each with a `.sha256` checksum
            (verify with `sha256sum -c <asset>.sha256`). Every artifact
            was smoke-checked with `--version` before publishing, except
            the cross-compiled Windows arm64 build. macOS arm64: build
            locally (see workflow header) and attach to this release.
