# Multi-platform release pipeline.
#
# Docker images (linux/amd64 + linux/arm64, multi-arch manifest):
#   - GitHub Container Registry (ghcr.io) — public pulls, no extra
#     accounts or secrets: pushes authenticate with the built-in
#     GITHUB_TOKEN (needs `packages: write`, set below).
#   - Aliyun ACR — reliable pulls from mainland China. Requires repo
#     secrets ALIYUN_USERNAME / ALIYUN_PASSWORD (ACR fixed password).
#
# Native binaries (GitHub Release assets):
#   - macOS arm64 (Apple Silicon / M-series)
#   - Linux amd64, Linux arm64
#   - Windows amd64, Windows arm64
#
# Triggered by version tags (v1.2.3); workflow_dispatch builds without
# creating a GitHub Release (artifacts stay on the run).
#
# NOTE: the first time this pushes, GHCR creates the package as
# PRIVATE. Make it public once:
#   github.com/users/afmkt/packages/container/janux/settings
#   → Change visibility → Public
# (or: gh package edit janux --visibility public)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ALIYUN_IMAGE: registry.cn-hangzhou.aliyuncs.com/afmkt/janux
  NODE_VERSION: "22"

jobs:
  # ═══════════════ Docker: per-arch builds (push by digest) ═══════════════

  docker-amd64:
    name: Docker image (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cross-border link to the mainland registry is flaky from GitHub
      # runners — retry the login instead of failing the whole release.
      - name: Login to Aliyun ACR
        run: |
          for i in 1 2 3 4 5; do
            docker login "$ALIYUN_REGISTRY" -u "$ALIYUN_USERNAME" --password-stdin <<< "$ALIYUN_PASSWORD" && exit 0
            echo "ACR login attempt $i failed; retrying in 30s..."
            sleep 30
          done
          echo "ACR login failed after 5 attempts" >&2
          exit 1
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # Layer cache (deps-only cargo layer stays warm between builds).
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64
          outputs: |
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ env.ALIYUN_IMAGE }},push-by-digest=true,name-canonical=true,push=true

  docker-arm64:
    name: Docker image (linux/arm64)
    # Native arm64 runner: no QEMU, so the Rust build is fast.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cross-border link to the mainland registry is flaky from GitHub
      # runners — retry the login instead of failing the whole release.
      - name: Login to Aliyun ACR
        run: |
          for i in 1 2 3 4 5; do
            docker login "$ALIYUN_REGISTRY" -u "$ALIYUN_USERNAME" --password-stdin <<< "$ALIYUN_PASSWORD" && exit 0
            echo "ACR login attempt $i failed; retrying in 30s..."
            sleep 30
          done
          echo "ACR login failed after 5 attempts" >&2
          exit 1
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-arm64
          outputs: |
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ env.ALIYUN_IMAGE }},push-by-digest=true,name-canonical=true,push=true

  # ═══════════════ Docker: multi-arch manifest + tags ═══════════════

  docker-publish:
    name: Publish multi-arch manifest
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        run: |
          for i in 1 2 3 4 5; do
            docker login "$ALIYUN_REGISTRY" -u "$ALIYUN_USERNAME" --password-stdin <<< "$ALIYUN_PASSWORD" && exit 0
            echo "ACR login attempt $i failed; retrying in 30s..."
            sleep 30
          done
          echo "ACR login failed after 5 attempts" >&2
          exit 1
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Create and push manifests
        env:
          AMD64: ${{ needs.docker-amd64.outputs.digest }}
          ARM64: ${{ needs.docker-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          TAGS=("latest" "${GITHUB_SHA::12}")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS+=("${GITHUB_REF#refs/tags/}")
          fi
          # Retry wrapper: the mainland registry link drops requests
          # intermittently from GitHub runners.
          retry() {
            local n
            for n in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $n failed: $*; retrying in 30s..."
              sleep 30
            done
            return 1
          }
          for repo in "$REGISTRY/$IMAGE_NAME" "$ALIYUN_IMAGE"; do
            for tag in "${TAGS[@]}"; do
              retry docker buildx imagetools create \
                -t "$repo:$tag" \
                "$repo@$AMD64" \
                "$repo@$ARM64"
            done
            retry docker buildx imagetools inspect "$repo:latest" | head -20
          done

  # ═══════════════ Native binaries ═══════════════

  binaries:
    name: Binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon / M-series) — macos runners are arm64.
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: janux
            asset: janux-macos-arm64
          # Linux amd64 / arm64.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: janux
            asset: janux-linux-amd64
            packages: pkg-config libssl-dev
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary: janux
            asset: janux-linux-arm64
            packages: pkg-config libssl-dev
          # Windows amd64 (native) and arm64 (cross-compiled on amd64 host).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: janux.exe
            asset: janux-windows-amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: janux.exe
            asset: janux-windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/dist is embedded at compile time (rust-embed).
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.asset }}.tar.gz \
            -C target/${{ matrix.target }}/release ${{ matrix.binary }}

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/${{ matrix.binary }} `
            -DestinationPath dist/${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  # ═══════════════ GitHub Release (tag pushes only) ═══════════════

  release:
    name: Publish GitHub Release
    needs: [binaries, docker-publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: janux-*
          path: assets
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            ## Docker images (linux/amd64 + linux/arm64)
            - `docker pull ghcr.io/afmkt/janux:${{ github.ref_name }}`
            - Aliyun ACR (mainland China): `${{ env.ALIYUN_IMAGE }}:${{ github.ref_name }}`
            (also tagged `latest` and short-SHA)

            ## Binaries
            Attached assets for macOS arm64, Linux amd64/arm64,
            Windows amd64/arm64.
