# Example base server configuration.
# Copy to base.toml (gitignored) and adjust, then run: janux -c base -c seed
data_dir = "./data"
# 64 hex chars (32 bytes) for AES-256-GCM. Generate your own, e.g.:
#   openssl rand -hex 32
# RECOVERY-CRITICAL: this key encrypts secrets at rest (social provider
# secrets, TOTP secrets, Resend/Aliyun delivery keys). Losing it renders
# those secrets permanently undecryptable — TOTP users must re-enroll and
# provider credentials must be re-entered. Rotating it requires
# decrypting and re-encrypting every stored secret under the new key.
encryption_key = "1234567812345678123456781234567812345678123456781234567812345678"
# true  = behind a reverse proxy (Caddy/Traefik/...) that OVERWRITES X-Forwarded-*:
#         trust them for tenant resolution and per-IP rate limiting.
# false = standalone (DEFAULT, G-149): ignore X-Forwarded-* headers, use Host
#         and the real URI. A directly reachable server in `true` mode can be
#         tenant-spoofed and limiter-bypassed with forged headers — the boot
#         log warns loudly when it is on.
trust_forwarded_headers = false

# When `trust_forwarded_headers = true`, this restricts which TCP *source*
# addresses are allowed to *supply* `X-Forwarded-*` headers. A forwarded
# header is honored only when the connection's remote peer is one of these
# IPs or CIDR blocks — this is what makes trusting headers safe even on a
# directly reachable port (G-149): a client that is not your proxy can no
# longer forge `X-Forwarded-Host` (tenant/issuer) or `X-Forwarded-For`
# (per-IP limiter / audit IP).
#
# Empty (the default here) with `trust_forwarded_headers = true` keeps the
# legacy "trust every peer" behavior, which the boot log warns about — fill
# it with your proxy's address(es) to close the hole. A malformed entry
# aborts boot. Examples:
# trusted_proxies = ["10.0.0.5", "172.16.0.0/12", "fd00::/8"]
trusted_proxies = []

[bind]
address = "0.0.0.0"
port = 8080
